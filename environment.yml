channels:
  - conda-forge
  - defaults
dependencies:


  # Core scientific packages
  - numpy>=1.21.0
  - scipy>=1.7.0
  - pandas>=1.3.0

  # ⚠️  CRITICAL: FEniCS packages (must be installed via conda)
  - fenics-dolfin>=2019.1.0
  # Removed mshr - using gmsh for better mesh generation instead

  # 3D processing and visualization
  - trimesh>=3.9.0
  - pyvista>=0.33.0
  - vtk>=9.0.0

  # Mesh processing (better alternative to mshr)
  - meshio>=5.0.0
